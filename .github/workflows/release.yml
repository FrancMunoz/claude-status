name: release

# Manual only, on purpose.
#
# This used to run on every push to master, which meant a release was a side
# effect of merging rather than a decision: a pull request titled "fix: ..."
# published a version the moment it was squashed, and one titled "docs: ..."
# did not, so whether users got a new build came down to how the title was
# worded. Releasing is now something someone chooses to do.
#
# build.yml still runs on every push and pull request, so master is verified
# continuously whether or not anything is released from it.
#
# Run it from Actions -> release -> Run workflow, on master. semantic-release
# still decides the version from the commits since the last tag, and still
# declines to release from any branch but master (.releaserc.json), so a
# dispatch on a topic branch analyses and stops rather than shipping.
on:
  workflow_dispatch:

# Three jobs, and every split is forced by something.
#
# The platform splits are the obvious two: vpk builds a macOS .app and .pkg only on
# macOS - it shells out to pkgbuild - and a Windows Setup.exe only on Windows. So
# the macOS artifacts are built first and handed to the Windows job as a workflow
# artifact, which uploads everything under one tag. Tagging and publishing happen
# exactly once, in the last job, for the reason the first version of this workflow
# was a single job: a tag pushed by one workflow does not trigger another (GitHub
# blocks that to prevent recursion), so a second workflow reacting to the release
# would silently never fire.
#
# The third split is about the signing key, not the platform. Deciding the version
# means running semantic-release, which npx installs at run time from a dependency
# tree of hundreds of packages. The macOS job holds a Developer ID private key in a
# keychain for the length of the build, and those two things must not share a
# runner: anything in that tree executes with the same access to the keychain as
# codesign, and a stolen Developer ID key lets someone ship malware signed as us.
# So the version is decided on its own runner, with no secrets present, and handed
# over as a job output.
permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs npm, holds no secrets. Deliberately in that order.
  #
  # The version has to be known before anything can be packed, and it is
  # semantic-release that decides it from the commit history. Asking it in
  # --dry-run mode gives the same answer the real run will reach in the last job,
  # from the same commits and the same config, without tagging anything.
  decide-version:
    name: decide the version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the commit history to decide the next version.
          # That does not work on a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Empty output when there is no release due - every commit since the last tag
      # was docs: or chore:, which is a perfectly normal thing to dispatch into.
      # Both later jobs are then skipped by their own `if`.
      #
      # Two things about the grep, and both are load-bearing:
      #
      # -i, because semantic-release words the line differently for the very first
      # release. With a previous tag it says "The next release version is X.Y.Z";
      # with none it says "There is no previous release, the next release version
      # is X.Y.Z" - lower-case, because it is mid-sentence. A case-sensitive match
      # therefore finds nothing on exactly the release that has never been made,
      # which is the one release nobody can test by repeating.
      #
      # || true, because "no match" is a legitimate answer meaning "no release
      # due", and this step runs under set -e with pipefail: grep exiting 1 would
      # otherwise fail the job rather than leave `version` empty as intended.
      - name: Decide the version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx --yes \
            -p semantic-release@24 \
            -p @semantic-release/exec@6 \
            -p @semantic-release/github@11 \
            semantic-release --dry-run | tee semantic-release.log || true
          version=$(grep -oiE 'the next release version is [0-9]+\.[0-9]+\.[0-9]+[^ ]*' semantic-release.log | tail -1 | awk '{print $NF}' || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "No release due; nothing further will run."
          else
            echo "Releasing $version."
          fi

  # Holds the signing key, runs no npm. The other half of the split above.
  package-macos:
    name: sign and package the macOS installer
    runs-on: macos-latest
    needs: decide-version
    if: needs.decide-version.outputs.version != ''
    # Not GitHub's default of six hours. A signing tool stuck on a keychain dialog
    # hangs silently rather than failing, and for as long as it does the key sits
    # unlocked on the runner. Two hours still leaves notarisation room to be slow.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Before the build rather than after, because the alternative to failing here
      # is worse than a failed release: pack.ps1 packs happily without these and
      # prints a warning, so a missing secret would ship an unsigned .pkg that
      # nobody notices until a user's Gatekeeper refuses it.
      - name: Check the signing configuration
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          APP_IDENTITY: ${{ vars.MACOS_SIGN_APP_IDENTITY }}
          INSTALL_IDENTITY: ${{ vars.MACOS_SIGN_INSTALL_IDENTITY }}
        run: |
          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "::error::$1 is not set. See docs/releasing.md."
              missing=1
            fi
          }
          check 'secrets.MACOS_CERTIFICATE_P12'       "$CERTIFICATE"
          check 'secrets.MACOS_CERTIFICATE_PASSWORD'  "$CERTIFICATE_PASSWORD"
          check 'secrets.MACOS_NOTARY_KEY_P8'         "$NOTARY_KEY"
          check 'secrets.MACOS_NOTARY_KEY_ID'         "$NOTARY_KEY_ID"
          check 'secrets.MACOS_NOTARY_ISSUER_ID'      "$NOTARY_ISSUER_ID"
          check 'vars.MACOS_SIGN_APP_IDENTITY'        "$APP_IDENTITY"
          check 'vars.MACOS_SIGN_INSTALL_IDENTITY'    "$INSTALL_IDENTITY"
          [ "$missing" -eq 0 ]

      # A keychain of its own, created here and destroyed at the end of the job,
      # rather than the runner's login keychain. It keeps the private key apart
      # from anything else on the runner, and makes the cleanup a single delete
      # that cannot miss anything.
      - name: Import the signing certificates
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # -lut 21600 and no -l: do not relock on sleep, and time out well past the
          # length of a build. Notarisation waits on Apple and "usually takes
          # minutes, but could take hours"; a keychain that relocks underneath it
          # fails the sign step with a message about the user cancelling, which is
          # not a thing that happened on a runner nobody is sitting at.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERTIFICATE_PATH="$RUNNER_TEMP/certificates.p12"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # -T names the only tools allowed to use these keys without a prompt.
          # codesign signs the .app with the Application certificate; the .pkg is
          # signed with the Installer one by productbuild, which is what vpk calls
          # (`productbuild --sign`), not productsign - leave productbuild out and
          # it waits forever on a keychain dialog nobody can see, with the log
          # stopped at "Creating installer '.pkg'". productsign stays for anyone
          # re-signing a .pkg by hand.
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$CERTIFICATE_PATH"

          # Without this, every codesign call blocks on a GUI confirmation dialog
          # that nobody can answer, and the job hangs until the runner times out
          # rather than failing with anything that names the cause.
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # notarytool reads credentials from a named profile, so the API key has to
          # be stored as one. --keychain puts it in the temporary keychain with the
          # certificates instead of the runner's login keychain.
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          xcrun notarytool store-credentials 'claude-status-notary' \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm -f "$NOTARY_KEY_PATH"

          # On the user search list, ahead of what is already there. It has to be:
          # vpk 1.2.0 passes --keychain to codesign and `notarytool submit`, but
          # not to `productbuild --sign` or `notarytool log`, which can only look
          # on the search list - and codesign itself answers "no identity found"
          # for a keychain given by path that is not on it. Being listed grants
          # nothing new: the keychain is already unlocked for any process that
          # names its path, and the partition list still limits the keys to
          # Apple's tools. It is never made the default, and deleting it at the
          # end of the job takes it off the list again.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Names the identities codesign and productbuild will be asked for, so a
          # mismatch with vars.MACOS_SIGN_*_IDENTITY is visible here rather than
          # as "no identity found" three steps later. Not secret - see Pack below.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p basic "$KEYCHAIN"

          # Still set, so codesign and notarytool look in this keychain first
          # rather than in whatever else is on the list.
          echo "VPK_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # vpk, from .config/dotnet-tools.json, pinned to the same version as the
      # Velopack package the app links against.
      - name: Restore tools
        run: dotnet tool restore

      # The identities are repository variables rather than secrets on purpose. They
      # are not secret - the certificate's common name and team id are embedded in
      # every binary we sign and `codesign -dv` prints them from any download - and
      # making them secrets would mask them in this job's log, so a mismatch between
      # the configured name and the imported certificate would show up as
      # "*** not found" instead of naming what it looked for.
      - name: Pack
        env:
          MAC_SIGN_APP_IDENTITY: ${{ vars.MACOS_SIGN_APP_IDENTITY }}
          MAC_SIGN_INSTALL_IDENTITY: ${{ vars.MACOS_SIGN_INSTALL_IDENTITY }}
          MAC_NOTARY_PROFILE: claude-status-notary
        run: pwsh ./build/pack.ps1 -Version '${{ needs.decide-version.outputs.version }}' -Runtime osx-arm64

      # Proves the artifacts are what they claim before they leave this runner. vpk
      # already runs spctl, but it checks what it just built in a temporary
      # directory; this checks the files actually being uploaded.
      - name: Verify the signature and notarisation
        run: |
          set -euo pipefail
          spctl -a -vvv -t install artifacts/releases/ClaudeStatus-osx-Setup.pkg
          xcrun stapler validate artifacts/releases/ClaudeStatus-osx-Setup.pkg

          # ditto, not unzip. unzip does not preserve the symlinks and extended
          # attributes inside a .app, and the copy it produces fails validation with
          # "no usable signature" even when the archive is perfectly signed.
          ditto -x -k artifacts/releases/ClaudeStatus-osx-Portable.zip "$RUNNER_TEMP/verify"
          spctl -a -vvv -t exec "$RUNNER_TEMP/verify/ClaudeStatus.app"
          xcrun stapler validate "$RUNNER_TEMP/verify/ClaudeStatus.app"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 1

      # always(), because the interesting case is the failed build: a job that dies
      # during notarisation would otherwise leave the key on the runner.
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificates.p12" "$RUNNER_TEMP/notary.p8" || true

  release:
    name: package Windows, tag and publish every platform
    # Windows, because vpk builds the Setup.exe natively here. The macOS
    # artifacts are carried in from the job above.
    runs-on: windows-latest
    needs: [decide-version, package-macos]
    if: needs.decide-version.outputs.version != ''

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the commit history to decide the next version,
          # and MinVer reads tags. Neither works on a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore

      # The gate. A release must never ship something the build workflow would have
      # rejected. build.yml has already run against this commit on its way into
      # master, but this workflow is dispatched by hand and can be pointed at any
      # commit, so it re-proves it here rather than trusting that it was checked.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release

      # vpk, from .config/dotnet-tools.json, pinned to the same version as the
      # Velopack package the app links against.
      - name: Restore tools
        run: dotnet tool restore

      # Into the directory pack.ps1 writes to and the github plugin uploads from.
      # pack.ps1 creates that directory but never empties it, so the macOS files
      # are still there when the Windows ones land beside them.
      - name: Download the macOS release
        uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: artifacts/releases

      # No MAC_SIGN_* here, and not by omission: pack.ps1 throws if they are set for
      # a win-x64 runtime, because vpk rejects macOS signing arguments on a Windows
      # build rather than ignoring them.
      #
      # semantic-release decides from the Conventional Commits whether there is a
      # release at all. If there is, its prepare step runs build/pack.ps1 with the
      # computed version and its github step tags, writes the notes and uploads
      # the installer. If there is not, it does nothing and exits zero.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Each package needs its own -p. Without them npx would treat the plugin
        # packages as command-line arguments to semantic-release rather than as
        # things to install, and @semantic-release/exec - the plugin that runs
        # build/pack.ps1 - would not be there at all.
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/exec@6
          -p @semantic-release/github@11
          semantic-release
