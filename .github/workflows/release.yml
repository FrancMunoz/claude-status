name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

# The whole release is one job on one runner, deliberately.
#
# Splitting "decide the version" from "build it" would mean passing the version
# between jobs and re-checking out, and a tag pushed by one workflow does not
# trigger another (GitHub blocks that to prevent recursion), so the obvious
# two-workflow shape silently never fires. One job avoids both problems.
permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Windows, because the only artifact today is the win-x64 installer and vpk
    # builds a Windows Setup.exe natively there.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the commit history to decide the next version,
          # and MinVer reads tags. Neither works on a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore

      # The gate. A release must never ship something the build workflow would
      # have rejected, and this workflow runs on the same push, not after it.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release

      # vpk, from .config/dotnet-tools.json, pinned to the same version as the
      # Velopack package the app links against.
      - name: Restore tools
        run: dotnet tool restore

      # semantic-release decides from the Conventional Commits whether there is a
      # release at all. If there is, its prepare step runs build/pack.ps1 with the
      # computed version and its github step tags, writes the notes and uploads
      # the installer. If there is not, it does nothing and exits zero.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Each package needs its own -p. Without them npx would treat the plugin
        # packages as command-line arguments to semantic-release rather than as
        # things to install, and @semantic-release/exec - the plugin that runs
        # build/pack.ps1 - would not be there at all.
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/exec@6
          -p @semantic-release/github@11
          semantic-release
