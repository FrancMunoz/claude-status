name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from tags, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # `dotnet test` forwards unknown options to the test app under
      # Microsoft.Testing.Platform, so no --nologo here.
      - name: Test
        run: dotnet test --no-build --configuration Release

  # The iCUE widget is HTML, not .NET: Corsair's own CLI is what says whether
  # iCUE will accept it. Validated on every push for the same reason the code is
  # built on every push - a broken manifest should not wait for a release to be
  # noticed. The package it produces is uploaded so a reviewer can install it
  # from the workflow run without a release.
  widget:
    name: iCUE widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Pinned: a new CLI can tighten validation, and a red build should mean the
      # widget changed, not the validator.
      - name: Install the iCUE Widget CLI
        run: npm install -g icuewidget-cli@0.4.47

      - name: Validate
        run: icuewidget validate widgets/icue/ClaudeUsage

      # The CLI writes the package beside the widget folder, named after the
      # widget, so it is moved to the name the release attaches.
      - name: Package
        run: |
          set -euo pipefail
          icuewidget package widgets/icue/ClaudeUsage
          mkdir -p artifacts/widget
          mv widgets/icue/claude-usage.icuewidget artifacts/widget/ClaudeUsage.icuewidget

      - uses: actions/upload-artifact@v7
        with:
          name: icue-widget
          path: artifacts/widget/ClaudeUsage.icuewidget
          if-no-files-found: error

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify formatting
        run: dotnet format --verify-no-changes --severity warn
